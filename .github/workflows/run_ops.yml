name: operational opendrift

on:
  workflow_dispatch:
    inputs:
      model_type:
        description: "The kind of model to run"
        required: true
        default: oceandrift
        type: choice
        options:
          - oceandrift
          - oil
          - leeway
          - phytodrift

      run_model:
        description: "run the model?"
        required: true
        type: boolean
        default: true

      do_post:
        description: "do the postprocessing?"
        required: true
        type: boolean
        default: true

      extents:
        description: "lon0,lon1,lat0,lat1 or None"
        required: true
        default: None
        type: string

      dx_m:
        description: "grid size (m) or None"
        required: true
        default: None
        type: string

          #  schedule:
          #    - cron: "0 10 * * *"

env:
  REGISTRY: ghcr.io

  # Works for both manual + scheduled runs
  MODEL_TYPE: ${{ github.event.inputs.model_type || 'phytodrift' }}
  RUN_MODEL: ${{ github.event.inputs.run_model || 'true' }}
  DO_POST: ${{ github.event.inputs.do_post || 'true' }}
  EXTENTS: ${{ github.event.inputs.extents || 'None' }}
  DX_M: ${{ github.event.inputs.dx_m || 'None' }}

jobs:

  ##########################################################################
  # Detect branch
  ##########################################################################

  branch-ref:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.branch.outputs.value }}

    steps:
      - name: Set branch name
        id: branch
        run: echo "value=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT


  ##########################################################################
  # Load config variables
  ##########################################################################

  envs:
    needs: branch-ref
    runs-on: ubuntu-latest

    outputs:
      BRANCH_REF: ${{ needs.branch-ref.outputs.value }}
      CONFIG_NAME: ${{ steps.config.outputs.value }}
      RUN_DATE: ${{ steps.rundate.outputs.value }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.branch-ref.outputs.value }}

      - name: Read config_name
        id: config
        run: |
          line=$(grep -m 1 -w config_name configs/config_${{ env.MODEL_TYPE }}.py)
          value=$(echo "$line" | awk -F "=" '{print $2}' | sed 's/^[[:space:]]*//')
          echo "value=$value" >> $GITHUB_OUTPUT

      - name: Read run_date
        id: rundate
        run: |
          line=$(grep -m 1 -w run_date configs/config_${{ env.MODEL_TYPE }}.py)
          value=$(echo "$line" | awk -F "=" '{print $2}' | sed 's/^[[:space:]]*//')
          echo "value=$value" >> $GITHUB_OUTPUT


  ##########################################################################
  # Build image
  ##########################################################################

  build_image:
    uses: ./.github/workflows/build_image.yml

  ##########################################################################
  # Download Phytoplankton Flags
  ##########################################################################
  
  download_phytoplankton_flags:
    if: ${{ env.MODEL_TYPE == 'phytodrift' }}
    needs: [pull-latest-docker-images]
    uses: ./.github/workflows/download_phytoplankton_flags.yml
    with:
      RUNNER_NAME: ${{ inputs.RUNNER_NAME }}
      RUN_DATE: ${{ inputs.RUN_DATE }}
      BRANCH_REF: ${{ inputs.BRANCH_REF }}
    secrets: inherit

  ##########################################################################
  # Download CMEMS Waves
  ##########################################################################
  
  download_cmems_waves:
    if: ${{ env.MODEL_TYPE == 'phytodrift' }}
    needs: [pull-latest-docker-images]
    uses: ./.github/workflows/download_cmems_waves.yml
    with:
      RUNNER_NAME: ${{ inputs.RUNNER_NAME }}
      RUN_DATE: ${{ inputs.RUN_DATE }}
      BRANCH_REF: ${{ inputs.BRANCH_REF }}
      HDAYS: 5
      FDAYS: 5
    secrets: inherit

  ##########################################################################
  # Detect available forecast folders
  ##########################################################################

  check_models:
    runs-on: mims1

    outputs:
      RUN_GFS_MERCATOR: ${{ steps.check.outputs.RUN_GFS_MERCATOR }}
      RUN_SAWS_MERCATOR: ${{ steps.check.outputs.RUN_SAWS_MERCATOR }}
      RUN_GFS_HYCOM: ${{ steps.check.outputs.RUN_GFS_HYCOM }}
      RUN_SAWS_HYCOM: ${{ steps.check.outputs.RUN_SAWS_HYCOM }}

    steps:
      - name: Check available directories
        id: check
        run: |
          BASE=/mnt/ocims-somisana/public-facing/sa-west/v1.0/forecasts/latest

          [ -d "$BASE/MERCATOR-GFS" ] \
            && echo "RUN_GFS_MERCATOR=true" >> $GITHUB_OUTPUT \
            || echo "RUN_GFS_MERCATOR=false" >> $GITHUB_OUTPUT

          [ -d "$BASE/MERCATOR-SAWS" ] \
            && echo "RUN_SAWS_MERCATOR=true" >> $GITHUB_OUTPUT \
            || echo "RUN_SAWS_MERCATOR=false" >> $GITHUB_OUTPUT

          [ -d "$BASE/HYCOM-GFS" ] \
            && echo "RUN_GFS_HYCOM=true" >> $GITHUB_OUTPUT \
            || echo "RUN_GFS_HYCOM=false" >> $GITHUB_OUTPUT

          [ -d "$BASE/HYCOM-SAWS" ] \
            && echo "RUN_SAWS_HYCOM=true" >> $GITHUB_OUTPUT \
            || echo "RUN_SAWS_HYCOM=false" >> $GITHUB_OUTPUT


  ##########################################################################
  # Run MERCATOR + GFS
  ##########################################################################

  run_GFS_MERCATOR:
    needs: [envs, build_image, check_models]
    if: needs.check_models.outputs.RUN_GFS_MERCATOR == 'true'

    uses: ./.github/workflows/run_model.yml
    with:
      MODEL_TYPE: ${{ env.MODEL_TYPE }}
      BRANCH_REF: ${{ needs.envs.outputs.BRANCH_REF }}
      CONFIG_NAME: ${{ needs.envs.outputs.CONFIG_NAME }}
      RUN_DATE: ${{ needs.envs.outputs.RUN_DATE }}
      RUNNER_NAME: mims1
      WIND: GFS
      OGCM: MERCATOR
      RUN_MODEL: ${{ env.RUN_MODEL }}
      DO_POST: ${{ env.DO_POST }}
      EXTENTS: ${{ env.EXTENTS }}
      DX_M: ${{ env.DX_M }}

  ##########################################################################
  # Run MERCATOR + SAWS
  ##########################################################################

  run_SAWS_MERCATOR:
    needs: [envs, build_image, check_models]
    if: needs.check_models.outputs.RUN_SAWS_MERCATOR == 'true'

    uses: ./.github/workflows/run_model.yml
    with:
      MODEL_TYPE: ${{ env.MODEL_TYPE }}
      BRANCH_REF: ${{ needs.envs.outputs.BRANCH_REF }}
      CONFIG_NAME: ${{ needs.envs.outputs.CONFIG_NAME }}
      RUN_DATE: ${{ needs.envs.outputs.RUN_DATE }}
      RUNNER_NAME: mims1
      WIND: SAWS
      OGCM: MERCATOR
      RUN_MODEL: ${{ env.RUN_MODEL }}
      DO_POST: ${{ env.DO_POST }}
      EXTENTS: ${{ env.EXTENTS }}
      DX_M: ${{ env.DX_M }}

  ##########################################################################
  # Run HYCOM + GFS
  ##########################################################################

  run_GFS_HYCOM:
    needs: [envs, build_image, check_models]
    if: needs.check_models.outputs.RUN_GFS_HYCOM == 'true'

    uses: ./.github/workflows/run_model.yml
    with:
      MODEL_TYPE: ${{ env.MODEL_TYPE }}
      BRANCH_REF: ${{ needs.envs.outputs.BRANCH_REF }}
      CONFIG_NAME: ${{ needs.envs.outputs.CONFIG_NAME }}
      RUN_DATE: ${{ needs.envs.outputs.RUN_DATE }}
      RUNNER_NAME: mims1
      WIND: GFS
      OGCM: HYCOM
      RUN_MODEL: ${{ env.RUN_MODEL }}
      DO_POST: ${{ env.DO_POST }}
      EXTENTS: ${{ env.EXTENTS }}
      DX_M: ${{ env.DX_M }}

  ##########################################################################
  # Run HYCOM + SAWS
  ##########################################################################

  run_SAWS_HYCOM:
    needs: [envs, build_image, check_models]
    if: needs.check_models.outputs.RUN_SAWS_HYCOM == 'true'

    uses: ./.github/workflows/run_model.yml
    with:
      MODEL_TYPE: ${{ env.MODEL_TYPE }}
      BRANCH_REF: ${{ needs.envs.outputs.BRANCH_REF }}
      CONFIG_NAME: ${{ needs.envs.outputs.CONFIG_NAME }}
      RUN_DATE: ${{ needs.envs.outputs.RUN_DATE }}
      RUNNER_NAME: mims1
      WIND: SAWS
      OGCM: HYCOM
      RUN_MODEL: ${{ env.RUN_MODEL }}
      DO_POST: ${{ env.DO_POST }}
      EXTENTS: ${{ env.EXTENTS }}
      DX_M: ${{ env.DX_M }}

  ##########################################################################
  # Combine output
  ##########################################################################

  combine_output:
    needs:
      - envs
      - run_GFS_MERCATOR
      - run_SAWS_MERCATOR
      - run_GFS_HYCOM
      - run_SAWS_HYCOM

    if: ${{ always() && env.DO_POST == 'true' }}

    uses: ./.github/workflows/combine_output.yml
    with:
      MODEL_TYPE: ${{ env.MODEL_TYPE }}
      BRANCH_REF: ${{ needs.envs.outputs.BRANCH_REF }}
      CONFIG_NAME: ${{ needs.envs.outputs.CONFIG_NAME }}
      RUN_DATE: ${{ needs.envs.outputs.RUN_DATE }}
      RUNNER_NAME: mims1
      EXTENTS: ${{ env.EXTENTS }}
      DX_M: ${{ env.DX_M }}
