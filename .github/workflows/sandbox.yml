name: Sandbox for testing individual calleable workflows
# (not used in th operational workflow at all)

on:
  workflow_dispatch:

jobs:
  build_cli:
    uses: ./.github/workflows/build_image.yml

  run_model:
    needs: [build_cli]
    runs-on: mims3
    steps:
      - name: run the model
        run: |
          docker run \
            --rm \
            --user root \
            -v /home/somisana/ops/hab-advection/20260414_00:/mnt/tmp \
            ghcr.io/saeon/somisana-opendrift_hab-advection:latest \
              run_model \
                --config_dir /mnt/tmp \
                --model_type phytodrift
          # change ownership to somisana user
          sudo chown -R somisana:somisana /home/somisana/ops/hab-advection/20260414_00

